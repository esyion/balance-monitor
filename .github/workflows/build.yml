name: Build and Release

on:
  push:
    tags:
      - 'v*'              # 推送 v 开头的 tag 时触发,如 v1.1.2
  workflow_dispatch:      # 允许手动触发(可在 Actions 页面运行)

# 取消上一次正在跑的同 workflow 运行,避免重复构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 需要写入权限来创建 release
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows installer
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 14
          compression-level: 9

  build-unpack:
    name: Build Unpacked (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unpacked version
        run: pnpm build:unpack

      - name: Upload unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-build
          path: dist/win-unpacked/
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build macOS package
        run: pnpm build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # CI 环境跳过证书发现,避免未配置证书时报错

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg
          retention-days: 14
          compression-level: 9

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
          retention-days: 14
          compression-level: 9

  create-release:
    name: Create Release
    needs: [build-windows, build-unpack, build-macos, build-linux]
    runs-on: ubuntu-latest
    # 只在 tag 推送时创建 Release;手动触发(workflow_dispatch)不创建
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.package-version.outputs.version }}
          tag_name: v${{ steps.package-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows-build/*
            artifacts/macos-build/*
            artifacts/linux-build/*
          body: |
            Balance Monitor v${{ steps.package-version.outputs.version }}

            ## Downloads
            - Windows Installer: `balance-monitor-${{ steps.package-version.outputs.version }}-setup.exe`
            - macOS DMG: `balance-monitor-${{ steps.package-version.outputs.version }}.dmg`
            - Linux AppImage: `balance-monitor-${{ steps.package-version.outputs.version }}.AppImage`
            - Linux DEB: `balance-monitor_${{ steps.package-version.outputs.version }}_amd64.deb`
            - Linux Snap: `balance-monitor_${{ steps.package-version.outputs.version }}_amd64.snap`

            详细更新内容请查看 `doc/changelog/release-notes-v${{ steps.package-version.outputs.version }}.md`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
